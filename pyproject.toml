[project]
name = "tvorec-cover"
version = "1.0.0"
description = "Tvorec Cover (Творец корици) -- cross-platform desktop app for building print-ready, wrap-around book covers from front/back/spine images."
readme = "README.md"
authors = [
    { name = "Stoyan Bonchev", email = "sm1rfs88@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
upscale = [
    "opencv-python>=4.9.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://tvorec.org"

[project.scripts]
tvorec-cover = "cover_generator.app:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cover_generator"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
