name: CI

# Lint and test on every push/PR, on all three target OSes -- this is the
# fast feedback loop; .github/workflows/release.yml handles the actual
# PyInstaller packaging on tag pushes.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

      - name: Install Linux GUI/OpenGL libraries for offscreen Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0

      - name: Test
        run: uv run pytest -q
