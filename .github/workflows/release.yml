name: Build release binaries

# PyInstaller does not cross-compile, so each OS builds its own binary on a
# matching runner. Triggered by pushing a "v*" tag (attaches binaries to a
# GitHub Release) or manually via workflow_dispatch (artifacts only, no
# release).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tvorec-cover
            asset_name: TvorecCover-linux
          - os: windows-latest
            artifact_name: tvorec-cover.exe
            asset_name: TvorecCover-windows.exe
          - os: macos-latest
            artifact_name: tvorec-cover
            asset_name: TvorecCover-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/tvorec-cover.spec --noconfirm

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact_name }}" "out/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
